<!DOCTYPE html>
<html lang="en">
<head>

<title>30° Wing Wall — 18' face × 16' wings × 6' H · T-anchors on C2</title>
<style>

  #header .dims { font-size: 12px; color: #4a5568; font-variant-numeric: tabular-nums; }
  #header .stack { margin-left: auto; font-size: 11px; color: #718096; font-family: 'SF Mono', Menlo, monospace; }

  .panel {
    position: fixed;

  #legend { top: 60px; right: 12px; min-width: 230px; max-width: 290px; }
  #controls { bottom: 12px; left: 12px; max-width: 320px; }
  #cameraBtns { bottom: 12px; right: 12px; }

  .panel-title {
    font-size: 10px;

  #tooltip {

</style>
</head>
<body>

<div id="header">
  <h1>30° Wing Wall</h1>
  <div class="dims" id="dimsLabel">18' face · wings 16'/10'/6' @ 30° back · 6' H (3 courses)</div>
  <div class="stack">zero stacked seams · single T-anchor on C2 · flat-top C3</div>
</div>

<div id="legend" class="panel">
  <div class="panel-title">Block Counts</div>
  <div id="legendBody"></div>
</div>

<div id="controls" class="panel">
  <div class="panel-title">View</div>

  <div class="toggle-row btn-row">
    <button class="btn active" data-section="wing-W">Wing W</button>

    <button class="btn" data-view="front">Front</button>
    <button class="btn" data-view="side">Side</button>
  </div>
</div>

<div id="tooltip"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// CONFIG
// ============================================================
// Coordinate system:
//   Origin = ground level, center of the face's front edge.
//   +X east along face, -X west along face
//   +Y up
//   +Z back / embankment (backfill) side
// Face: world X ∈ [-9, +9], Z ∈ [0, 2]. Block centers at z = 1.
// Wings kick back 30° from the wall line (interior face↔wing angle 150°),
// flaring toward +Z. Each face corner has a half-cylinder pivot at (±8, _, 1),
// radius 1, formed by the rounded protrusion of the corner End block.
//
// Corner alternation (so the rounds nest and the cones stack in one vertical
// column per pivot):
//   C1: corner End blocks lie ALONG THE FACE — round at the pivot, 4' body
//       pointing at the face center.
//   C2: corner End blocks lie ALONG THE WINGS — round seats at the pivot and
//       fills the outer 2 ft of the 18' face; the 4' body starts the wing.
//   C3: back to face orientation, same as C1.
//
// C2 is the "special" course: a single 6' block rotated 90° (a T-anchor) sits
// dead center in the face — 2 ft in the wall line, 4 ft cantilevered over the
// backfill (floating in the model; bears on backfilled ground in real life).
//
// Running bond — this corner scheme yields ZERO stacked seams:
//   Face: C1/C3 joints at ±3 land mid-block on C2's 6-footers (spanning 1..7);
//   C2's joints at ±1 (T edges) and ±7 (round tangents) sit under/over solid
//   blocks on C1/C3.
//   Wings (distances from the pivot tangent): C1 = 6/6/4 (joints 6, 12),
//   C2 = corner body + 6' (joint 4, tip 10), C3 = one 6' (tip 6) — every
//   joint and step edge lands mid-block on the course below. The C3 wing is
//   a 6-footer, not a 4': a 4' tip would end exactly on C2's joint at 4.
//
// The "Opposing Wall" toggle adds wall B: wall A rotated 180° about y through
// the midplane z = -WALL_GAP/2, so the two faces look at each other across a
// WALL_GAP face-to-face channel and each wall's wings flare into its own
// backfill.

const COURSE_H = 2;       // each course is 2 ft tall
const N_COURSES = 3;      // top course is cast flat — no studs
const WALL_T   = 2;       // wall thickness / block depth (ft)
const EXPLODE_GAP = 3;
const WALL_GAP = 15;      // face-to-face distance when the opposing wall is on

const WING_DEFLECTION_DEG = 30;   // wing kick-back from the wall line
const WING_LEN_C1 = 16;           // counted from the pivot tangent point

const D = THREE.MathUtils.degToRad(WING_DEFLECTION_DEG);
const EAST_AXIS = { x:  Math.cos(D), z: Math.sin(D) };
const WEST_AXIS = { x: -Math.cos(D), z: Math.sin(D) };
const faceLength = 18;
const E_PIVOT   = { x: 0, z: 1 };
const W_PIVOT   = { x: 0, z: 1 };
const E_TANGENT = { x: 0, z: 0 };
const W_TANGENT = { x: 0, z: 0 };
function updatePivots() {
  const px = faceLength / 2 - 1;        // pivot is 1 ft inside the protrusion tip
  E_PIVOT.x =  px;  W_PIVOT.x = -px;
  E_TANGENT.x = E_PIVOT.x + EAST_AXIS.x;
  E_TANGENT.z = E_PIVOT.z + EAST_AXIS.z;
  W_TANGENT.x = W_PIVOT.x + WEST_AXIS.x;
  W_TANGENT.z = W_PIVOT.z + WEST_AXIS.z;
}
updatePivots();

// UI state — hoisted so buildWall() can re-apply it after rebuilding meshes.
const state = {
  exploded: false,
  opposing: false,
  courseVisible: [true, true, true],
  sectionVisible: { 'face': true, 'wing-W': true, 'wing-E': true },
};

// Soft pastel palette for block lengths; End block in slate, T-anchor in green.
const COLORS = {
  end6: 0x9aa6b4, tee6: 0x8fc97e, reg6: 0x7ba7d9, reg5: 0x6dd3c4,
  reg4: 0xfbbf6c, reg3: 0xc4a8f2, reg2: 0xf48a8a,
};
const TYPE_NAMES = {
  end6: "6′ End (rounded)",
  tee6: "6′ Beton — T-anchor (90°)",
  reg6: "6′ Beton", reg5: "5′ Beton", reg4: "4′ Beton",
  reg3: "3′ Beton", reg2: "2′ Beton",
};
const TYPE_WIDTH = { end6: 6, tee6: 6, reg6: 6, reg5: 5, reg4: 4, reg3: 3, reg2: 2 };

// ============================================================
// WALL LAYOUT — edit here to change the wall
// ============================================================
// Helpers below build BLOCKS[] entries. Conventions:
//   face(type, x, course)            x is the world-X center of the block
//   wing(type, side, distFromTangent, course)   distance along wing from the tangent point
//   faceTee(x, course)               6' T-anchor: 2' in the wall line, 4' back over backfill
//   course: 0 = bottom, 1 = middle, 2 = top
// End blocks on the face auto-orient: x<0 ⇒ rounded toward -X, x>0 ⇒ +X.
// End blocks on a wing seat their arc center at the pivot when placed at dist 1.

const BLOCKS = [];
function face(type, x, course) {
  const ry = (type === 'end6' && x < 0) ? Math.PI : 0;
  BLOCKS.push({ type, x, y: course * COURSE_H + COURSE_H/2, z: 1, ry, course, section: 'face' });
}
function wing(type, side, distFromTangent, course) {
  const axis    = (side === 'E') ? EAST_AXIS : WEST_AXIS;
  const tangent = (side === 'E') ? E_TANGENT : W_TANGENT;
  // Regular blocks: local +X points down the wing (away from pivot).
  // End blocks: rotated 180° so local +X points back at the pivot — the flat
  // short end faces the wing tip, the rounded end seats at the pivot.
  const isEnd = type === 'end6';
  const ry = (side === 'E')
    ? (isEnd ? Math.PI - D : -D)
    : (isEnd ? D : D - Math.PI);
  BLOCKS.push({
    type,
    x: tangent.x + distFromTangent * axis.x,
    y: course * COURSE_H + COURSE_H/2,
    z: tangent.z + distFromTangent * axis.z,
    ry, course, section: `wing-${side}`,
  });
}
function faceTee(x, course) {
  // 6' block turned 90°: spans z 0..6 (2 ft in the wall line, 4 ft cantilever
  // over the backfill). Floats in the model above course 1's back edge.
  BLOCKS.push({
    type: 'tee6', x,
    y: course * COURSE_H + COURSE_H/2,
    z: 3, ry: Math.PI / 2, course, section: 'face',
  });
}

function populateLayout() {
  BLOCKS.length = 0;

  // ───── COURSE 1 (bottom) ─────
  // Face 18 ft: [end6][6'][end6] — corner End blocks lie along the face,
  // rounds at the pivots, 4' bodies pointing in. Interior joints at ±3.
  face('end6', -6, 0);
  face('reg6',  0, 0);
  face('end6',  6, 0);

  // Wings 16 ft of regulars from the tangent: 6' + 6' + 4' (joints at 6, 12).
  // The only order that keeps C2's joint at 4 and tip at 10 mid-block below.
  for (const s of ['W', 'E']) {
    wing('reg6', s, 3,  0);
    wing('reg6', s, 9,  0);
    wing('reg4', s, 14, 0);
  }

  // ───── COURSE 2 (middle) — the "special" course ─────
  // Corner End blocks alternate onto the wings (round at the pivot, 4' body
  // starting the wing). Face: [round][6'][T][6'][round] — one T-anchor dead
  // center, joints at ±1 covered by C1/C3's middle 6-footers.
  face('reg6', -4, 1);
  faceTee(0, 1);
  face('reg6',  4, 1);

  // Wings step down to 10 ft: corner body (0-4) + one 6-footer (4-10).
  for (const s of ['W', 'E']) {
    wing('end6', s, 1, 1);   // arc center seats at the pivot
    wing('reg6', s, 7, 1);
  }

  // ───── COURSE 3 (top) ─────
  // Face same as course 1; each wing is a single 6-footer (tip at 6, clear
  // of C2's joint at 4 — a 4' block would end right on it).
  // This whole course is cast flat — no studs.
  face('end6', -6, 2);
  face('reg6',  0, 2);
  face('end6',  6, 2);
  wing('reg6', 'W', 3, 2);
  wing('reg6', 'E', 3, 2);

  // ───── OPPOSING WALL (toggle) ─────
  // Wall B = wall A rotated 180° about y through the midplane z = -WALL_GAP/2:
  // x → -x, z → -WALL_GAP - z, ry → ry + π. Section labels swap so wing-W
  // stays at world -X and wing-E at world +X for both walls.
  if (state.opposing) {
    const wallACount = BLOCKS.length;
    for (let i = 0; i < wallACount; i++) {
      const a = BLOCKS[i];
      BLOCKS.push({
        ...a,
        x: -a.x,
        z: -WALL_GAP - a.z,
        ry: a.ry + Math.PI,
        wall: 'B',
        section: a.section === 'wing-W' ? 'wing-E'
               : a.section === 'wing-E' ? 'wing-W'
               : a.section,
      });
    }
  }
}

// ============================================================
// BLOCK GEOMETRY
// ============================================================

// Debossed AROOSTA CAST normal map for the long faces of regular blocks.
function createTextTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgb(128, 128, 255)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.font = 'bold 70px "Arial Black", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const text = 'AROOSTA CAST';
  const cx = canvas.width / 2, cy = canvas.height / 2;
  for (let i = 5; i >= 0; i--) {
    const shade = 90 + i * 8;
    ctx.fillStyle = `rgb(${shade}, ${shade}, 255)`;
    ctx.fillText(text, cx + i * 0.5, cy + i * 0.5);
  }
  ctx.fillStyle = 'rgb(80, 80, 255)';
  ctx.fillText(text, cx, cy);
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
}
const textTexture = createTextTexture();

// 4-sided pyramid frustum stud (one per foot of width, two rows).
const STUD_TOP_R  = 2.5 / 12 / 2;        // top dia 2.5"
const STUD_BOT_R  = 5.5 / 12 / 2;        // bottom dia 5.5"
const STUD_H      = 0.15;                // ~2"
const studGeo     = new THREE.CylinderGeometry(STUD_TOP_R, STUD_BOT_R, STUD_H, 4, 1, false, Math.PI/4);
const studMat     = new THREE.MeshPhongMaterial({ color: 0x7a8696, flatShading: true });
const studEdgeGeo = new THREE.EdgesGeometry(studGeo);

function makePyramidStud(x, z) {
  const stud = new THREE.Mesh(studGeo, studMat);
  stud.position.set(x, STUD_H/2, z);
  stud.castShadow = true;
  stud.receiveShadow = true;
  stud.add(new THREE.LineSegments(studEdgeGeo, new THREE.LineBasicMaterial({ color: 0x404040 })));
  return stud;
}

// Studs for a regular block: pyramid frustums on a 1 ft grid, two rows 6" from edge.
function createStudsGroup(width, depth) {
  const group = new THREE.Group();
  const startX = -width/2 + 0.5;
  for (let row = 0; row < 2; row++) {
    const z = (row === 0) ? -depth/2 + 0.5 : depth/2 - 0.5;
    for (let i = 0; i < Math.floor(width); i++) {
      group.add(makePyramidStud(startX + i, z));
    }
  }
  return group;
}

// Studs for an End block: 4 pyramid studs in the straight section, plus the
// big cone stud at the rounded end (the corner pivot).
const ROUND_STUD_TOP_R = 8.5 / 12 / 2;   // 8.5" dia at top
const ROUND_STUD_BOT_R = 1.0 / 2;        // 1 ft dia at base
const ROUND_STUD_H     = 0.25;           // ~3"
const roundStudGeo     = new THREE.CylinderGeometry(ROUND_STUD_TOP_R, ROUND_STUD_BOT_R, ROUND_STUD_H, 16, 1);
const roundStudEdgeGeo = new THREE.EdgesGeometry(roundStudGeo);

function createEndStudsGroup(width, depth) {
  const group = new THREE.Group();
  const startX = -width/2 + 0.5;
  for (let row = 0; row < 2; row++) {
    const z = (row === 0) ? -depth/2 + 0.5 : depth/2 - 0.5;
    for (let i = 0; i < 4; i++) {
      group.add(makePyramidStud(startX + i, z));
    }
  }
  // Big cone stud: centered exactly on the arc axis of the rounded protrusion
  // (local x = width/2 - depth/2). This is the pivot axis, so any orientation
  // of an End block placed at the same pivot puts its cone in the same world
  // (x, z) — the cones stack as a single vertical column up the corner.
  const roundStud = new THREE.Mesh(roundStudGeo, studMat);
  roundStud.position.set(width/2 - depth/2, ROUND_STUD_H/2, 0);
  roundStud.castShadow = true;
  roundStud.receiveShadow = true;
  roundStud.add(new THREE.LineSegments(
    roundStudEdgeGeo, new THREE.LineBasicMaterial({ color: 0x404040 })
  ));
  group.add(roundStud);
  return group;
}

// Extruded geometry for the End block — flat back/sides on -X, rounded
// half-cylinder protrusion on +X. Centered on local origin in all three axes,
// so block.position = block center.
function createEndGeometry(width, height, depth) {
  const shape = new THREE.Shape();
  shape.moveTo(-width/2, -height/2);
  shape.lineTo(width/2 - depth/2, -height/2);
  shape.absarc(width/2 - depth/2, 0, depth/2, -Math.PI/2, Math.PI/2, false);
  shape.lineTo(-width/2, height/2);
  shape.lineTo(-width/2, -height/2);

  const geo = new THREE.ExtrudeGeometry(shape, { steps: 1, depth, bevelEnabled: false });
  geo.rotateX(-Math.PI / 2);
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  geo.translate(
    -(bb.min.x + bb.max.x) / 2,
    -(bb.min.y + bb.max.y) / 2,
    -(bb.min.z + bb.max.z) / 2
  );
  return geo;
}

// Build a single block mesh from a spec.
const allBlocks = [];
function createBlockMesh(spec) {
  const width = TYPE_WIDTH[spec.type];
  const isEnd = spec.type === 'end6';
  const color = COLORS[spec.type];
  let geo, materials;

  if (isEnd) {
    geo = createEndGeometry(width, COURSE_H, WALL_T);
    materials = new THREE.MeshPhongMaterial({ color, shininess: 8 });
  } else {
    geo = new THREE.BoxGeometry(width, COURSE_H, WALL_T);
    // BoxGeometry face order: +X, -X, +Y, -Y, +Z, -Z. Apply debossed text to
    // the four side faces (±X long ends + ±Z front/back).
    materials = [];
    for (let i = 0; i < 6; i++) {
      const m = new THREE.MeshPhongMaterial({ color, shininess: 8 });
      if (i === 0 || i === 1 || i === 4 || i === 5) {
        const tex = textTexture.clone();
        tex.center.set(0, 0);
        tex.repeat.set(1.5, 1.5);
        const off = (1.5 - 1) / (2 * 1.5);
        tex.offset.set(off, off);
        tex.needsUpdate = true;
        m.normalMap = tex;
        m.normalScale = new THREE.Vector2(2.2, -2.2);
      }
      materials.push(m);
    }
  }

  const mesh = new THREE.Mesh(geo, materials);
  mesh.position.set(spec.x, spec.y, spec.z);
  mesh.rotation.y = spec.ry;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData = { spec };

  // Top course is cast with a flat top — no studs, including the corner cone.
  if (spec.course < N_COURSES - 1) {
    const studs = isEnd
      ? createEndStudsGroup(width, WALL_T)
      : createStudsGroup(width, WALL_T);
    studs.position.y = COURSE_H / 2;
    mesh.add(studs);
  }

  mesh.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: 0x1a202c, transparent: true, opacity: 0.78 })
  ));

  allBlocks.push(mesh);
  return mesh;
}

// ============================================================
// SCENE
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef2f7);
scene.fog = new THREE.Fog(0xeef2f7, 100, 320);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 600);
const targetPoint = new THREE.Vector3(0, 2, 4);
camera.position.set(40, 30, 48);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.62));

const dirLight = new THREE.DirectionalLight(0xffffff, 0.78);
dirLight.position.set(25, 60, 35);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.left = -50;
dirLight.shadow.camera.right = 50;
dirLight.shadow.camera.top = 50;
dirLight.shadow.camera.bottom = -50;
dirLight.shadow.camera.near = 1;
dirLight.shadow.camera.far = 160;
dirLight.shadow.bias = -0.0005;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0xb8d4f0, 0.32);
fillLight.position.set(-25, 25, -10);
scene.add(fillLight);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshLambertMaterial({ color: 0xdce3eb })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(80, 40, 0x94a3b8, 0xc4cdd6);
grid.position.set(0, 0, 4);
grid.material.opacity = 0.6;
grid.material.transparent = true;
scene.add(grid);

// Footprint outlines on ground. Tracked so they can be rebuilt on toggle.
const footprintObjects = [];
function addFootprint(geo, x, z, ry = 0) {
  const o = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: 0x475569 })
  );
  o.position.set(x, 0.01, z);
  o.rotation.y = ry;
  scene.add(o);
  footprintObjects.push(o);
}
function populateFootprints() {
  footprintObjects.forEach(o => scene.remove(o));
  footprintObjects.length = 0;

  const half = WING_LEN_C1 / 2;
  const specs = [
    { w: faceLength, d: WALL_T, x: 0, z: 1, ry: 0 },
    { w: WING_LEN_C1, d: WALL_T, ry: -D,
      x: E_TANGENT.x + half * EAST_AXIS.x, z: E_TANGENT.z + half * EAST_AXIS.z },
    { w: WING_LEN_C1, d: WALL_T, ry: D - Math.PI,
      x: W_TANGENT.x + half * WEST_AXIS.x, z: W_TANGENT.z + half * WEST_AXIS.z },
    // Ground projection of the C2 T-anchor (it floats at course-2 height).
    { w: WALL_T, d: 6, x: 0, z: 3, ry: 0 },
  ];
  for (const s of specs) {
    addFootprint(new THREE.BoxGeometry(s.w, 0.02, s.d), s.x, s.z, s.ry);
    if (state.opposing) {
      addFootprint(new THREE.BoxGeometry(s.w, 0.02, s.d), -s.x, -WALL_GAP - s.z, s.ry + Math.PI);
    }
  }
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(targetPoint);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 200;
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

// Build the wall.
const courseGroups = Array.from({ length: N_COURSES }, () => new THREE.Group());
courseGroups.forEach(g => scene.add(g));

function buildWall() {
  updatePivots();
  courseGroups.forEach(g => { while (g.children.length) g.remove(g.children[0]); });
  allBlocks.length = 0;
  populateLayout();
  BLOCKS.forEach(spec => courseGroups[spec.course].add(createBlockMesh(spec)));
  populateFootprints();
  updateLegend();
  applyVisibility();
  updateLayout();
}
buildWall();

// ============================================================
// UI: legend, toggles, camera, tooltip
// ============================================================
function updateLegend() {
  const counts = {};
  BLOCKS.forEach(b => { counts[b.type] = (counts[b.type] || 0) + 1; });
  const order = ['end6', 'tee6', 'reg6', 'reg5', 'reg4', 'reg3', 'reg2'];
  let html = '', total = 0;
  order.forEach(k => {
    if (!counts[k]) return;
    total += counts[k];
    const colorHex = '#' + COLORS[k].toString(16).padStart(6, '0');
    html += `
      <div class="legend-row">
        <div class="legend-color" style="background:${colorHex}"></div>
        <div class="legend-label">${TYPE_NAMES[k]}</div>
        <div class="legend-count">${counts[k]}</div>
      </div>`;
  });
  html += `
    <div class="legend-total">
      <span class="label">Total blocks</span>
      <span class="count">${total}</span>
    </div>`;
  document.getElementById('legendBody').innerHTML = html;
}

function updateLayout() {
  for (let i = 0; i < courseGroups.length; i++) {
    courseGroups[i].position.y = state.exploded ? i * EXPLODE_GAP : 0;
  }
}
function applyVisibility() {
  for (let i = 0; i < courseGroups.length; i++) {
    courseGroups[i].children.forEach(mesh => {
      const s = mesh.userData.spec;
      if (!s) return;
      mesh.visible = state.courseVisible[s.course] && state.sectionVisible[s.section];
    });
  }
}

document.querySelectorAll('[data-course]').forEach(btn => {
  btn.addEventListener('click', e => {
    const i = parseInt(e.currentTarget.dataset.course);
    state.courseVisible[i] = !state.courseVisible[i];
    e.currentTarget.classList.toggle('active', state.courseVisible[i]);
    applyVisibility();
  });
});
document.querySelectorAll('[data-section]').forEach(btn => {
  btn.addEventListener('click', e => {
    const key = e.currentTarget.dataset.section;
    state.sectionVisible[key] = !state.sectionVisible[key];
    e.currentTarget.classList.toggle('active', state.sectionVisible[key]);
    applyVisibility();
  });
});
document.getElementById('explodeToggle').addEventListener('click', e => {
  state.exploded = !state.exploded;
  e.currentTarget.classList.toggle('active', state.exploded);
  updateLayout();
});
const dimsBase = document.getElementById('dimsLabel').textContent;
document.getElementById('opposingToggle').addEventListener('click', e => {
  state.opposing = !state.opposing;
  e.currentTarget.classList.toggle('active', state.opposing);
  buildWall();
  grid.position.z = state.opposing ? -WALL_GAP / 2 : 4;
  document.getElementById('dimsLabel').textContent =
    dimsBase + (state.opposing ? ` · ${WALL_GAP}' face-to-face` : '');
  const activeView = document.querySelector('[data-view].active');
  animateCamera(getPresets()[activeView ? activeView.dataset.view : 'iso']);
});
document.getElementById('resetToggle').addEventListener('click', () => {
  state.exploded = false;
  document.getElementById('explodeToggle').classList.remove('active');
  state.courseVisible = [true, true, true];
  state.sectionVisible = { 'face': true, 'wing-W': true, 'wing-E': true };
  document.querySelectorAll('[data-course], [data-section]').forEach(b => b.classList.add('active'));
  applyVisibility();
  animateCamera(getPresets().iso);
  document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-view="iso"]').classList.add('active');
  updateLayout();
});

// Presets depend on whether the opposing wall is up (the pair is centered on
// the midplane z = -WALL_GAP/2; a single wall on its own backfill at z = 4).
function getPresets() {
  if (!state.opposing) {
    return {
      iso:   { pos: new THREE.Vector3(40, 30, 48),    target: new THREE.Vector3(0, 2, 4) },
      top:   { pos: new THREE.Vector3( 0, 90, 4.001), target: new THREE.Vector3(0, 0, 4) },
      front: { pos: new THREE.Vector3( 0, 10, -48),   target: new THREE.Vector3(0, 2, 4) },
      side:  { pos: new THREE.Vector3(58,  8, 4),     target: new THREE.Vector3(0, 2, 4) },
    };
  }
  const zc = -WALL_GAP / 2;
  return {
    iso:   { pos: new THREE.Vector3(52, 40, 52),          target: new THREE.Vector3(0, 2, zc) },
    top:   { pos: new THREE.Vector3( 0, 105, zc + 0.001), target: new THREE.Vector3(0, 0, zc) },
    front: { pos: new THREE.Vector3( 0, 12, -WALL_GAP - 48), target: new THREE.Vector3(0, 2, zc) },
    side:  { pos: new THREE.Vector3(64,  8, zc),          target: new THREE.Vector3(0, 2, zc) },
  };
}
function animateCamera(preset, duration = 600) {
  const startPos = camera.position.clone();
  const startTarget = controls.target.clone();
  const startTime = performance.now();
  function step() {
    const t = Math.min((performance.now() - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    camera.position.lerpVectors(startPos, preset.pos, eased);
    controls.target.lerpVectors(startTarget, preset.target, eased);
    controls.update();
    if (t < 1) requestAnimationFrame(step);
  }
  step();
}
document.querySelectorAll('[data-view]').forEach(btn => {
  btn.addEventListener('click', e => {
    animateCamera(getPresets()[e.currentTarget.dataset.view]);
    document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
    e.currentTarget.classList.add('active');
  });
});

// Hover tooltip (desktop only).
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
let isTouch = false;
window.addEventListener('touchstart', () => { isTouch = true; }, { once: true });

function findBlockAncestor(o) {
  while (o && !o.userData?.spec) o = o.parent;
  return o;
}
renderer.domElement.addEventListener('pointermove', e => {
  if (isTouch) return;
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const intersects = raycaster.intersectObjects(allBlocks, true);
  if (intersects.length > 0) {
    const block = findBlockAncestor(intersects[0].object);
    if (block && block.visible) {
      const s = block.userData.spec;
      const sectionLabel =
        s.section === 'face'   ? 'Face' :
        s.section === 'wing-W' ? 'West Wing' : 'East Wing';
      tooltip.innerHTML = `<strong>${TYPE_NAMES[s.type]}</strong> · ${sectionLabel} · C${s.course + 1}${s.wall === 'B' ? ' · Wall B' : ''}`;
      tooltip.style.left = e.clientX + 'px';
      tooltip.style.top = e.clientY + 'px';
      tooltip.style.display = 'block';
      return;
    }
  }
  tooltip.style.display = 'none';
});
renderer.domElement.addEventListener('pointerleave', () => {
  tooltip.style.display = 'none';
});

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 100));

function tick() {
  requestAnimationFrame(tick);
  controls.update();
  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
